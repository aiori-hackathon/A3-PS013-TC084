<!doctype html>
<html lang="en">
  <head>

    <!-- Inter and IBM Plex Mono are bundled: main.jsx imports them from
         @fontsource, and the build emits the woff2 files alongside the app.
         This head used to request the same two families from Google as well,
         so every load fetched fonts it already had, and a page meant to be
         read offline or on a locked-down network depended on a third party
         to render its own type. -->
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="TracePoint is a cybersecurity investigation prototype for analyzing logs, correlating security events, and verifying evidence integrity."
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracepoint | Security Investigation Platform</title>
      <link rel="icon" type="image/svg+xml" href="/tracepoint-mark.svg?v=6" />
    <link rel="apple-touch-icon" href="/tracepoint-mark.svg?v=6" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
