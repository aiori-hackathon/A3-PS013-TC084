<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- The Tracepoint monogram, same geometry as TracepointMark.jsx. Kept as a
       standalone file so the browser tab, the PWA icon and the in-app mark are
       one drawing rather than three that can drift apart. -->
  <rect width="100" height="100" rx="22" fill="#090c11"/>
  <g fill="none" stroke="#c3f04a" stroke-width="7.5">
    <rect x="12" y="8" width="76" height="76" rx="27"/>
    <rect x="26.5" y="22.5" width="47" height="47" rx="16.5"/>
    <rect x="38" y="34" width="24" height="23" rx="11.5"/>
  </g>
  <path d="M50 40 V96" stroke="#090c11" stroke-width="19" fill="none"/>
  <path d="M50 40 V96" stroke="#c3f04a" stroke-width="9" stroke-linecap="round" fill="none"/>
</svg>
